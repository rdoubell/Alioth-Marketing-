<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Alioth Marketing Solutions — Coming Soon</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;1,600&display=swap" rel="stylesheet" />
<style>
  :root {
    --black: #0E0D0B;
    --cream: #F1E9DA;
    --green: #1B3B2F;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    background: var(--black);
  }
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: clamp(1.5rem, 4vw, 2.5rem);
  }
  .mark {
    width: clamp(64px, 12vw, 120px);
    height: auto;
    opacity: 0.96;
  }
  .label {
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-size: clamp(1.5rem, 4vw, 2.4rem);
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--green);
  }
</style>
</head>
<body>
  <img class="mark" src="assets/A-cream.png" alt="Alioth" />
  <div class="label">Coming Soon...</div>
</body>
</html>
