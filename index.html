<!doctype html>
<html lang="en-ZA">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1B3B2F" />
    <!-- This is a client-rendered SPA (see SEOMeta.tsx), so these static tags
         are what non-JS crawlers and link-preview bots see before React
         mounts — kept in sync with Home.tsx's <SEOMeta> so the homepage
         still reads correctly even without JS executing. Every other route
         only gets correct title/description after hydration; see the SEO
         note in docs/checklist.md about pre-rendering per-route HTML. -->
    <title>Marketing Agency Johannesburg | Alioth Marketing Solutions</title>
    <meta
      name="description"
      content="Johannesburg marketing agency helping South African businesses grow through web design, SEO, paid media, and brand strategy — one team, no hand-offs."
    />
    <meta property="og:title" content="Marketing Agency Johannesburg | Alioth Marketing Solutions" />
    <meta
      property="og:description"
      content="Johannesburg marketing agency helping South African businesses grow through web design, SEO, paid media, and brand strategy — one team, no hand-offs."
    />
    <meta property="og:url" content="https://www.aliothgroup.co.za" />
    <meta property="og:image" content="https://www.aliothgroup.co.za/og-image.png" />
    <meta property="og:site_name" content="Alioth Marketing Solutions" />
    <meta property="og:locale" content="en_ZA" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
