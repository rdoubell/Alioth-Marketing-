<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Alioth — Wordmark Type Explorations</title>
<link rel="stylesheet" href="styles.css">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,500&family=Cormorant+Garamond:wght@500;600;700&family=Space+Grotesk:wght@500;600;700&family=Outfit:wght@400;500;600;700&family=Oswald:wght@400;500;600&family=Jost:wght@400;500;600&family=Montserrat:wght@600;700;800&family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap" rel="stylesheet">
<style>
  body{background:#E7E3DA;color:var(--ink)}
  .x-head{padding:clamp(40px,6vw,80px) var(--gut) clamp(24px,3vw,36px)}
  .x-head .bar{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;flex-wrap:wrap;border-bottom:1px solid var(--line-light);padding-bottom:24px}
  .toggle{display:inline-flex;border:1px solid var(--line-light);border-radius:999px;overflow:hidden;font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase}
  .toggle button{appearance:none;border:0;background:transparent;color:var(--ink-60);padding:10px 18px;cursor:pointer;font:inherit;letter-spacing:inherit}
  .toggle button.on{background:var(--ink);color:var(--cream)}
  .x-wrap{max-width:1240px;margin:0 auto;padding:0 var(--gut) clamp(80px,10vw,140px)}
  .grp{font-family:var(--mono);font-size:12px;letter-spacing:.24em;text-transform:uppercase;color:var(--ink-40);margin:clamp(36px,5vw,56px) 0 18px;display:flex;align-items:center;gap:14px}
  .grp::after{content:"";flex:1;height:1px;background:var(--line-light)}
  .cards{display:grid;gap:20px}
  @media(min-width:820px){.cards{grid-template-columns:1fr 1fr}}
  .card{background:var(--cream-soft);border:1px solid var(--line-light);border-radius:6px;padding:clamp(26px,3vw,40px);display:flex;flex-direction:column;gap:22px;min-height:230px;transition:background .25s,border-color .25s}
  .card .stage{flex:1;display:flex;align-items:center;justify-content:flex-start;padding:8px 0}
  .card .meta{display:flex;justify-content:space-between;align-items:baseline;gap:16px;border-top:1px solid var(--line-light);padding-top:16px}
  .card .fname{font-weight:700;font-size:15px}
  .card .fnote{font-family:var(--mono);font-size:11px;letter-spacing:.04em;color:var(--ink-60);text-align:right;max-width:24ch}
  .card .idx{font-family:var(--mono);font-size:11px;color:var(--ink-40)}
  .lockup-h .mark{height:.86em}
  /* dark mode */
  body.dark{background:#161512;color:var(--cream)}
  body.dark .x-head .bar{border-color:var(--line-dark)}
  body.dark .toggle{border-color:var(--line-dark)}
  body.dark .toggle button{color:var(--cream-60)}
  body.dark .toggle button.on{background:var(--cream);color:var(--ink)}
  body.dark .grp{color:var(--cream-40)}
  body.dark .grp::after{background:var(--line-dark)}
  body.dark .card{background:#0E0D0B;border-color:var(--line-dark)}
  body.dark .card .meta{border-color:var(--line-dark)}
  body.dark .card .fnote{color:var(--cream-60)}
  body.dark .card .idx{color:var(--cream-40)}
  body.dark .muted{color:var(--cream-60)}
  body.dark .x-head .lk a{color:var(--cream)}
  .card .lockup-h{color:var(--ink)}
  body.dark .card .lockup-h{color:var(--cream)}
</style>
</head>
<body>

<div class="x-head">
  <div class="bar">
    <div>
      <span class="eyebrow" style="color:var(--ink-40)">Alioth Group — Studies</span>
      <h1 class="h-l" style="margin:14px 0 0">Wordmark · type explorations</h1>
      <p class="muted" style="margin:14px 0 0;max-width:54ch">The <strong>icon never changes</strong> — only the “LIOTH” lettering. Compare options, then tell me which to promote into the main guideline. <a href="Alioth Brand Guidelines.html" style="white-space:nowrap">← Back to guidelines</a></p>
    </div>
    <div class="toggle" role="group" aria-label="Background">
      <button id="b-light" class="on">On cream</button>
      <button id="b-dark">On black</button>
    </div>
  </div>
</div>

<div class="x-wrap" id="root"></div>

<script>
  var SRC = {black:'assets/A-black.png', cream:'assets/A-cream.png'};
  function pick(c){var m=c.match(/\d+/g);if(!m)return 'black';var r=+m[0],g=+m[1],b=+m[2];return (r>175&&g>165&&b>145)?'cream':'black';}

  // Each option keeps the SAME icon; only the wordmark type differs.
  var GROUPS = [
    {title:'Serif — elegant & editorial', items:[
      {name:'Playfair Display', fam:"'Playfair Display',serif", w:700, ls:'.01em', note:'High-contrast serif · your pick'},
      {name:'Playfair Display · Medium', fam:"'Playfair Display',serif", w:500, ls:'.03em', note:'Lighter, more refined'},
      {name:'Cormorant Garamond', fam:"'Cormorant Garamond',serif", w:600, ls:'.05em', note:'Luxury serif, airy & tall'},
      {name:'Fraunces', fam:"'Fraunces',serif", w:600, ls:'.005em', note:'Characterful contemporary serif'}
    ]},
    {title:'Grotesque & geometric — modern', items:[
      {name:'Archivo (current)', fam:"'Archivo',sans-serif", w:800, ls:'-.005em', note:'Current — solid bold grotesque'},
      {name:'Space Grotesk', fam:"'Space Grotesk',sans-serif", w:700, ls:'-.01em', note:'Distinctive modern grotesque'},
      {name:'Outfit', fam:"'Outfit',sans-serif", w:600, ls:'.01em', note:'Clean, even geometric sans'},
      {name:'Montserrat', fam:"'Montserrat',sans-serif", w:700, ls:'.02em', note:'Corporate, dependable geometry'},
      {name:'Jost', fam:"'Jost',sans-serif", w:500, ls:'.08em', note:'Futura-like, elegant & wide-set'}
    ]},
    {title:'Distinctive — high personality', items:[
      {name:'Oswald', fam:"'Oswald',sans-serif", w:500, ls:'.06em', note:'Tall condensed, poster energy'},
      {name:'Space Mono', fam:"'Space Mono',monospace", w:700, ls:'.04em', note:'Technical / performance-led'}
    ]}
  ];

  var root = document.getElementById('root');
  var n = 0;
  GROUPS.forEach(function(g){
    var h = document.createElement('div'); h.className='grp'; h.textContent=g.title; root.appendChild(h);
    var grid = document.createElement('div'); grid.className='cards'; root.appendChild(grid);
    g.items.forEach(function(o){
      n++;
      var card = document.createElement('div'); card.className='card';
      card.innerHTML =
        '<div class="stage"><span class="lockup-h" style="font-size:clamp(40px,6vw,68px)">'+
          '<span class="mark"></span>'+
          '<span class="wordtail" style="font-family:'+o.fam+';font-weight:'+o.w+';letter-spacing:'+o.ls+'">lioth</span>'+
        '</span></div>'+
        '<div class="meta"><span class="fname">'+o.name+'</span><span class="fnote">'+o.note+'</span></div>'+
        '<div class="idx">'+(n<10?'0':'')+n+'</div>';
      grid.appendChild(card);
    });
  });

  function paintMarks(){
    document.querySelectorAll('.mark').forEach(function(el){
      var k = pick(getComputedStyle(el).color);
      el.innerHTML = '<img src="'+SRC[k]+'" alt="Alioth A" style="display:block;width:100%;height:100%;object-fit:contain">';
    });
  }
  paintMarks();

  var bl=document.getElementById('b-light'), bd=document.getElementById('b-dark');
  bl.onclick=function(){document.body.classList.remove('dark');bl.classList.add('on');bd.classList.remove('on');paintMarks();};
  bd.onclick=function(){document.body.classList.add('dark');bd.classList.add('on');bl.classList.remove('on');paintMarks();};
</script>
</body>
</html>
